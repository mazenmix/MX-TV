<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0E14">
<title>محول العملة السريع | MX Exchanger</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070a0f;color:#f5f7fa;font-family:"Segoe UI",Tahoma,Arial,sans-serif}body{min-height:100dvh;background:linear-gradient(180deg,#0a0e14 0%,#070a0f 100%)}
.wrap{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:20px 0 34px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0 18px;border-bottom:1px solid #232a34}
.langSwitch{display:flex;gap:5px;padding:4px;background:#0d121a;border:1px solid #27313d;border-radius:14px;direction:ltr}.langBtn{border:0;background:transparent;color:#7f8b99;padding:8px 11px;border-radius:10px;font-weight:800;cursor:pointer}.langBtn.active{background:#182433;color:#f4f8fc}
.home{color:#c8d3df;text-decoration:none;background:#0d121a;border:1px solid #27313d;border-radius:14px;padding:10px 15px;font-weight:800}.hero{text-align:center;padding:44px 0 26px}.hero p{margin:0;color:#8592a2;font-size:15px;line-height:1.65}
.card{background:#0d121a;border:1px solid #293341;border-radius:26px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.3)}.grid{display:grid;grid-template-columns:1fr 74px 1fr;gap:18px;align-items:end;direction:ltr}.side{direction:rtl}
.lab{display:block;color:#98a5b4;font-weight:800;margin:0 0 9px}.box{background:#10161f;border:1px solid #2b3441;border-radius:20px;overflow:visible;position:relative}
.amount{width:100%;border:0;outline:0;background:transparent;color:#fff;padding:22px 20px 15px;font-size:clamp(30px,5vw,48px);font-weight:900;text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
.currency{border-top:1px solid #25303c;background:#0f151e;padding:0;border-radius:0 0 19px 19px;direction:ltr;position:relative}.pickerBtn{width:100%;min-height:52px;border:0;background:transparent;color:#eef4fa;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;cursor:pointer;text-align:left}
.pickerMain{min-width:0;display:flex;align-items:center;gap:10px}.pickerCode{color:#75c5f8;font-weight:900;font-size:17px;min-width:42px}.pickerName{color:#eef4fa;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{color:#7e8a98;font-size:12px}
.pickerPanel{display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:30;background:#0d141e;border:1px solid #303b48;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:10px}.pickerPanel.open{display:block}
.search{width:100%;height:42px;border:1px solid #2b3948;border-radius:11px;outline:0;background:#0a1119;color:#fff;padding:0 12px;font-size:14px;direction:ltr}.search::placeholder{color:#667483}
.options{margin-top:8px;max-height:245px;overflow:auto;border-top:1px solid #202a35;padding-top:6px}.option{width:100%;border:0;background:transparent;color:#e8eef5;display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:center;padding:10px 9px;border-radius:9px;cursor:pointer;text-align:left;direction:ltr}.option:hover,.option:focus{background:#151f2b;outline:0}.optionCode{color:#77c7fa;font-weight:900}.optionName{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:16px 8px;text-align:center;color:#758394;font-size:13px}
.swap{width:62px;height:62px;border-radius:50%;border:1px solid #336c96;background:#102032;color:#dcefff;font-size:28px;font-weight:900;margin-bottom:17px;cursor:pointer}
.ratebar{margin-top:20px;background:#0b1119;border:1px solid #252f3a;border-radius:18px;padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.rate{direction:ltr;font-size:clamp(18px,2.6vw,25px);font-weight:900;font-variant-numeric:tabular-nums}.rate span{color:#6fc6ff}.updated{color:#7f8b99;font-size:13px}
.marketline{margin-top:10px;display:flex;justify-content:center;align-items:center;gap:8px;min-height:20px;color:#8d99a8;font-size:12px;text-align:center;direction:ltr}.dot{width:8px;height:8px;border-radius:50%;background:#4fa3e3;box-shadow:0 0 0 3px rgba(79,163,227,.12)}.marketline.street{color:#b7d8c2}.marketline.street .dot{background:#35ce72;box-shadow:0 0 0 3px rgba(53,206,114,.13)}
.status{min-height:20px;margin-top:7px;text-align:center;color:#788696;font-size:13px}.status.error{color:#ef9b9b}.foot{text-align:center;color:#5e6977;padding-top:24px;font-weight:700;font-size:12px;letter-spacing:.2px}
html[dir="ltr"] .side{direction:ltr}html[dir="ltr"] .top{direction:ltr}
@media(max-width:760px){.wrap{width:min(100% - 18px,1040px);padding-top:10px}.langBtn{padding:7px 9px;font-size:12px}.home{padding:9px 12px;font-size:13px}.hero{padding:32px 6px 20px}.card{padding:15px;border-radius:21px}.grid{grid-template-columns:1fr;gap:12px}.swap{margin:0 auto;transform:rotate(90deg);width:54px;height:54px}.amount{padding:18px 15px 12px}.ratebar{padding:15px}.pickerPanel{position:absolute}.options{max-height:210px}}
@media(min-width:1500px){.wrap{width:min(1180px,calc(100% - 48px))}.card{padding:34px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="langSwitch" aria-label="Language">
      <button class="langBtn active" id="langAr" type="button">عربي</button>
      <button class="langBtn" id="langEn" type="button">English</button>
    </div>
    <a class="home" id="homeLink" href="./">الرئيسية</a>
  </header>

  <section class="hero">
    <p id="subText">سعر شارع/سوق موازي حيث يتوفر مصدر محلي موثوق — وسعر سوق حي لباقي العملات</p>
  </section>

  <section class="card">
    <div class="grid">
      <div class="side">
        <label class="lab" id="fromLabel" for="fromAmount">من</label>
        <div class="box">
          <input class="amount" id="fromAmount" inputmode="decimal" autocomplete="off" value="100" aria-label="المبلغ من">
          <div class="currency" id="fromPicker">
            <button class="pickerBtn" id="fromPickerBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="pickerMain"><span class="pickerCode" id="fromCode">USD</span><span class="pickerName" id="fromName">US Dollar</span></span><span class="chev">▼</span>
            </button>
            <div class="pickerPanel" id="fromPanel">
              <input class="search" id="fromSearch" autocomplete="off" placeholder="Search USD, Dollar, Peso...">
              <div class="options" id="fromOptions" role="listbox"></div>
            </div>
          </div>
        </div>
      </div>

      <button class="swap" id="swap" type="button" aria-label="عكس العملات">⇄</button>

      <div class="side">
        <label class="lab" id="toLabel" for="toAmount">إلى</label>
        <div class="box">
          <input class="amount" id="toAmount" inputmode="decimal" autocomplete="off" value="—" aria-label="المبلغ إلى">
          <div class="currency" id="toPicker">
            <button class="pickerBtn" id="toPickerBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="pickerMain"><span class="pickerCode" id="toCode">IQD</span><span class="pickerName" id="toName">Iraqi Dinar</span></span><span class="chev">▼</span>
            </button>
            <div class="pickerPanel" id="toPanel">
              <input class="search" id="toSearch" autocomplete="off" placeholder="Search USD, Dollar, Peso...">
              <div class="options" id="toOptions" role="listbox"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="ratebar">
      <div class="rate" id="rateText">1 USD = <span>—</span> IQD</div>
      <div class="updated" id="updatedText">آخر تحديث: —</div>
    </div>
    <div class="marketline" id="marketLine"><span class="dot"></span><span id="marketText">—</span></div>
    <div class="status" id="status">جاري تحميل أسعار العملات…</div>
  </section>
  <footer class="foot">MazenmiX</footer>
</main>

<script>
const STREET_API='https://raw.githubusercontent.com/mazenmix/MX-Currency-/main/data/rates.json';
const IRAQ_MARKET_API='/api/market';
const FX_API='https://open.er-api.com/v6/latest/USD';
const STREET_KINDS=new Set(['parallel','street','informal','open-market','cash-market','free-market']);

const el={
  fromAmount:document.getElementById('fromAmount'),toAmount:document.getElementById('toAmount'),
  fromCode:document.getElementById('fromCode'),toCode:document.getElementById('toCode'),
  fromName:document.getElementById('fromName'),toName:document.getElementById('toName'),
  fromPickerBtn:document.getElementById('fromPickerBtn'),toPickerBtn:document.getElementById('toPickerBtn'),
  fromPanel:document.getElementById('fromPanel'),toPanel:document.getElementById('toPanel'),
  fromSearch:document.getElementById('fromSearch'),toSearch:document.getElementById('toSearch'),
  fromOptions:document.getElementById('fromOptions'),toOptions:document.getElementById('toOptions'),
  rateText:document.getElementById('rateText'),updatedText:document.getElementById('updatedText'),
  marketLine:document.getElementById('marketLine'),marketText:document.getElementById('marketText'),
  status:document.getElementById('status'),swap:document.getElementById('swap'),
  langAr:document.getElementById('langAr'),langEn:document.getElementById('langEn'),
  homeLink:document.getElementById('homeLink'),subText:document.getElementById('subText'),
  fromLabel:document.getElementById('fromLabel'),toLabel:document.getElementById('toLabel')
};

let rates={},meta={},bookUpdated=null,lastEdited='from',timer=null;
let lang=localStorage.getItem('mx_converter_lang')||'ar',fromCurrency='USD',toCurrency='IQD',codes=[];
const namesEn=new Intl.DisplayNames(['en'],{type:'currency'});
const namesAr=new Intl.DisplayNames(['ar'],{type:'currency'});
const T={
  ar:{home:'الرئيسية',sub:'سعر شارع/سوق موازي حيث يتوفر مصدر محلي موثوق — وسعر سوق حي لباقي العملات',from:'من',to:'إلى',updated:'آخر تحديث',loading:'جاري تحديث أسعار السوق…',unavailable:'السعر غير متوفر حالياً',fetchError:'تعذر جلب آخر سعر حالياً',search:'ابحث USD أو Dollar أو Peso...',empty:'ماكو عملة مطابقة',street:'سوق شارع / موازي',market:'سوق عالمي',direction:'شراء/بيع فعلي',iraqBoard:'الرقم محدث بورصة الحارثية/الكفاح'},
  en:{home:'Home',sub:'Verified street/parallel rates where a local market exists — live market FX for the rest',from:'From',to:'To',updated:'Last updated',loading:'Updating market rates…',unavailable:'Rate is currently unavailable',fetchError:'Unable to fetch the latest rate',search:'Search USD, Dollar, Peso...',empty:'No matching currency',street:'Street / parallel market',market:'Global FX market',direction:'direction-aware cash',iraqBoard:'Rate updated from Harithiya/Kifah exchange'}
};

function num(v){const n=Number(String(v).replace(/,/g,'').trim());return Number.isFinite(n)?n:0}
function fmt(n){if(!Number.isFinite(n))return '—';return new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(n)}
function fmtRate(n){if(!Number.isFinite(n))return '—';let max=6;if(n>=1000)max=2;else if(n>=100)max=3;else if(n>=1)max=4;return new Intl.NumberFormat('en-US',{maximumFractionDigits:max}).format(n)}
function formatLive(input){
  if(input.value==='—')return;
  const old=input.value,start=input.selectionStart??old.length,before=old.slice(0,start).replace(/,/g,'');
  let raw=old.replace(/,/g,'').replace(/[^0-9.]/g,'');
  const dot=raw.indexOf('.');if(dot!==-1)raw=raw.slice(0,dot+1)+raw.slice(dot+1).replace(/\./g,'');
  if(raw===''){input.value='';return}
  const hasDot=raw.includes('.');let [whole,dec='']=raw.split('.');whole=whole.replace(/^0+(?=\d)/,'')||'0';
  const grouped=whole.replace(/\B(?=(\d{3})+(?!\d))/g,',');const formatted=hasDot?`${grouped}.${dec}`:grouped;input.value=formatted;
  const significantBefore=before.replace(/[^0-9.]/g,'').length;let seen=0,newCaret=formatted.length;
  for(let i=0;i<formatted.length;i++){if(/[0-9.]/.test(formatted[i]))seen++;if(seen>=significantBefore){newCaret=i+1;break}}
  try{input.setSelectionRange(newCaret,newCaret)}catch{}
}
function currencyName(code,language=lang){try{return (language==='ar'?namesAr:namesEn).of(code)||code}catch{return code}}
function searchText(code){return `${code} ${currencyName(code,'en')} ${currencyName(code,'ar')}`.toLowerCase()}
function streetMeta(code){const m=meta[code];return m&&STREET_KINDS.has(String(m.kind||'').toLowerCase())?m:null}
function fromCurrencyToUsd(code){if(code==='USD')return 1;const r=Number(rates[code]);if(!(r>0))return NaN;const m=streetMeta(code),ask=Number(m?.sell);return 1/(ask>0?ask:r)}
function usdToCurrency(code){if(code==='USD')return 1;const r=Number(rates[code]);if(!(r>0))return NaN;const m=streetMeta(code);if(code==='IQD'){const sell=Number(m?.sell);return sell>0?sell:r}const bid=Number(m?.buy);return bid>0?bid:r}
function crossRate(from,to){if(from===to)return 1;const a=fromCurrencyToUsd(from),b=usdToCurrency(to);return Number.isFinite(a)&&Number.isFinite(b)?a*b:NaN}
function pairStreetSources(){const arr=[];for(const code of [fromCurrency,toCurrency]){const m=streetMeta(code);if(m?.source&&!arr.includes(m.source))arr.push(m.source)}return arr}
function pairUpdatedDate(){const candidates=[];for(const code of [fromCurrency,toCurrency]){const raw=streetMeta(code)?.updatedAt;if(raw){const d=new Date(raw);if(!Number.isNaN(d.getTime()))candidates.push(d)}}if(candidates.length)return new Date(Math.max(...candidates.map(d=>d.getTime())));return bookUpdated||new Date()}
function syncSelected(){el.fromCode.textContent=fromCurrency;el.toCode.textContent=toCurrency;el.fromName.textContent=currencyName(fromCurrency);el.toName.textContent=currencyName(toCurrency)}
function closePickers(){for(const [panel,btn] of [[el.fromPanel,el.fromPickerBtn],[el.toPanel,el.toPickerBtn]]){panel.classList.remove('open');btn.setAttribute('aria-expanded','false')}}
function renderOptions(side,query=''){
  const box=side==='from'?el.fromOptions:el.toOptions,q=query.trim().toLowerCase(),filtered=codes.filter(code=>!q||searchText(code).includes(q));box.innerHTML='';
  if(!filtered.length){const d=document.createElement('div');d.className='empty';d.textContent=T[lang].empty;box.appendChild(d);return}
  filtered.forEach(code=>{const b=document.createElement('button');b.type='button';b.className='option';b.setAttribute('role','option');b.innerHTML=`<span class="optionCode">${code}</span><span class="optionName"></span>`;b.querySelector('.optionName').textContent=currencyName(code);b.addEventListener('click',()=>{if(side==='from')fromCurrency=code;else toCurrency=code;syncSelected();closePickers();render(lastEdited)});box.appendChild(b)})
}
function openPicker(side){const panel=side==='from'?el.fromPanel:el.toPanel,btn=side==='from'?el.fromPickerBtn:el.toPickerBtn,search=side==='from'?el.fromSearch:el.toSearch;const wasOpen=panel.classList.contains('open');closePickers();if(wasOpen)return;panel.classList.add('open');btn.setAttribute('aria-expanded','true');search.value='';renderOptions(side,'');setTimeout(()=>search.focus(),0)}
function setLanguage(next){lang=next;localStorage.setItem('mx_converter_lang',lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';el.langAr.classList.toggle('active',lang==='ar');el.langEn.classList.toggle('active',lang==='en');el.homeLink.textContent=T[lang].home;el.subText.textContent=T[lang].sub;el.fromLabel.textContent=T[lang].from;el.toLabel.textContent=T[lang].to;el.fromSearch.placeholder=T[lang].search;el.toSearch.placeholder=T[lang].search;el.swap.setAttribute('aria-label',lang==='ar'?'عكس العملات':'Swap currencies');document.title=(lang==='ar'?'محول العملة السريع':'Quick Currency Converter')+' | MX Exchanger';syncSelected();renderOptions('from',el.fromSearch.value);renderOptions('to',el.toSearch.value);render(lastEdited)}
function setUpdated(){const d=pairUpdatedDate();el.updatedText.textContent=T[lang].updated+': '+new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
function renderMarketLine(){const sources=pairStreetSources(),isStreet=sources.length>0;el.marketLine.classList.toggle('street',isStreet);if([fromCurrency,toCurrency].includes('IQD')&&streetMeta('IQD')){el.marketText.textContent=T[lang].iraqBoard;return}if(isStreet){const directionAware=[fromCurrency,toCurrency].some(c=>{const m=streetMeta(c);return Number(m?.buy)>0&&Number(m?.sell)>0});el.marketText.textContent=`${T[lang].street} · ${sources.join(' + ')}${directionAware?' · '+T[lang].direction:''}`}else{el.marketText.textContent=T[lang].market+' · USD cross-rate'}}
async function applyIraqMarket(){
  try{
    const r=await fetch(IRAQ_MARKET_API+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('Iraq market HTTP '+r.status);
    const d=await r.json();
    const board=(d.harithiya&&Number(d.harithiya.sell)>0)?d.harithiya:((d.kifah&&Number(d.kifah.sell)>0)?d.kifah:null);
    if(!board)throw new Error('No Harithiya/Kifah quote');
    const buy100=Number(board.buy),sell100=Number(board.sell);
    if(!(sell100>0))throw new Error('Bad IQD sell quote');
    const buy=(buy100>0?buy100:sell100)/100,sell=sell100/100;
    rates.IQD=sell;
    meta.IQD={
      kind:'parallel',
      source:'Baghdad Harithiya/Kifah board · @dollariraqi',
      buy,
      sell,
      updatedAt:d.usd_meta?.published_at||d.updated_at||new Date().toISOString()
    };
  }catch(_){}
}
function render(direction='from'){
  const r=crossRate(fromCurrency,toCurrency);syncSelected();renderMarketLine();setUpdated();
  if(!Number.isFinite(r)){el.status.className='status error';el.status.textContent=T[lang].unavailable;return}
  if(direction==='from'){el.toAmount.value=fmt(num(el.fromAmount.value)*r);el.rateText.innerHTML=`1 ${fromCurrency} = <span>${fmtRate(r)}</span> ${toCurrency}`}
  else{const inv=crossRate(toCurrency,fromCurrency);if(!Number.isFinite(inv)){el.status.className='status error';el.status.textContent=T[lang].unavailable;return}el.fromAmount.value=fmt(num(el.toAmount.value)*inv);el.rateText.innerHTML=`1 ${toCurrency} = <span>${fmtRate(inv)}</span> ${fromCurrency}`}
  el.status.className='status';el.status.textContent=''
}
async function load(){
  el.status.className='status';el.status.textContent=T[lang].loading;let loaded=false;
  try{const r=await fetch(STREET_API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Street HTTP '+r.status);const d=await r.json();if(d.base!=='USD'||!d.rates)throw new Error('bad street data');rates=d.rates;meta=d.meta||{};const t=new Date(d.updatedAt||Date.now());bookUpdated=Number.isNaN(t.getTime())?new Date():t;loaded=true}catch(_){}
  if(!loaded){try{const r=await fetch(FX_API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('FX HTTP '+r.status);const d=await r.json();if(d.result!=='success'||!d.rates)throw new Error('bad fx data');rates=d.rates;meta={};bookUpdated=d.time_last_update_unix?new Date(d.time_last_update_unix*1000):new Date();loaded=true}catch(_){}}
  if(!loaded){el.status.className='status error';el.status.textContent=T[lang].fetchError;return}
  await applyIraqMarket();
  codes=Object.keys(rates).filter(c=>/^[A-Z]{3}$/.test(c)).sort();renderOptions('from');renderOptions('to');render(lastEdited)
}
function schedule(side){lastEdited=side;clearTimeout(timer);timer=setTimeout(()=>render(side),120)}
el.fromAmount.addEventListener('input',()=>{formatLive(el.fromAmount);schedule('from')});el.toAmount.addEventListener('input',()=>{formatLive(el.toAmount);schedule('to')});el.fromAmount.addEventListener('focus',()=>lastEdited='from');el.toAmount.addEventListener('focus',()=>lastEdited='to');
el.fromPickerBtn.addEventListener('click',()=>openPicker('from'));el.toPickerBtn.addEventListener('click',()=>openPicker('to'));el.fromSearch.addEventListener('input',e=>renderOptions('from',e.target.value));el.toSearch.addEventListener('input',e=>renderOptions('to',e.target.value));
el.swap.addEventListener('click',()=>{const fc=fromCurrency,tc=toCurrency,fv=el.fromAmount.value,tv=el.toAmount.value;fromCurrency=tc;toCurrency=fc;el.fromAmount.value=tv==='—'?'100':tv;el.toAmount.value=fv;lastEdited='from';render('from')});
el.langAr.addEventListener('click',()=>setLanguage('ar'));el.langEn.addEventListener('click',()=>setLanguage('en'));
document.addEventListener('click',e=>{if(!document.getElementById('fromPicker').contains(e.target)&&!document.getElementById('toPicker').contains(e.target))closePickers()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePickers()});
setLanguage(lang);load();setInterval(load,60000);
</script>
</body>
</html>
