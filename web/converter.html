<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0E14">
<title>محول العملة السريع | MX Exchanger</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#060b12;--panel:#0b121c;--panel2:#0e1723;--panel3:#101b28;
  --line:#223247;--line2:#2a3b52;--text:#f5f8fc;--muted:#8c9aae;
  --blue:#46b6ff;--blue2:#137ec4;--green:#39da7c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
body{
  min-height:100dvh;
  background:
    radial-gradient(900px 520px at 12% -12%,rgba(30,112,211,.15),transparent 58%),
    radial-gradient(760px 460px at 96% 0%,rgba(71,71,214,.10),transparent 58%),
    linear-gradient(180deg,#07101a 0%,#05090f 100%);
}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.wrap{width:min(1120px,calc(100% - 36px));margin:0 auto;padding:26px 0 38px}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:16px;direction:ltr;
  padding:10px 4px 20px;border-bottom:1px solid rgba(83,105,132,.32)
}
.home{
  display:inline-flex;align-items:center;gap:9px;color:#e4edf7;text-decoration:none;
  background:linear-gradient(180deg,rgba(18,31,46,.92),rgba(10,20,31,.92));
  border:1px solid #2a4059;border-radius:15px;padding:10px 15px;font-weight:800;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);transition:.18s ease
}
.home:hover{border-color:#3a6d93;background:#102033}
.homeIcon{font-size:16px;color:#d9efff}
.langSwitch{
  display:flex;gap:4px;padding:4px;background:#09111b;border:1px solid #26384d;
  border-radius:15px;direction:ltr;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)
}
.langBtn{
  border:0;background:transparent;color:#8392a6;padding:8px 13px;border-radius:11px;
  font-weight:800;cursor:pointer;transition:.18s ease
}
.langBtn.active{
  color:#dff4ff;background:linear-gradient(180deg,#15365a,#102943);
  box-shadow:0 0 0 1px rgba(64,167,237,.30),0 0 22px rgba(32,151,235,.13)
}
.hero{display:none!important}
.card{
  position:relative;margin-top:22px;padding:28px;
  background:linear-gradient(180deg,rgba(13,23,35,.97),rgba(9,17,27,.97));
  border:1px solid #26384c;border-radius:28px;
  box-shadow:0 28px 80px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.018);
  overflow:visible
}
.card:before{
  content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;
  background:linear-gradient(135deg,rgba(47,135,202,.035),transparent 28%,transparent 72%,rgba(59,97,162,.025))
}
.grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);gap:22px;align-items:center;direction:ltr}
.side{direction:rtl;min-width:0}
.box{
  background:linear-gradient(180deg,#101a27 0%,#0d1621 100%);
  border:1px solid #2b3c51;border-radius:20px;overflow:visible;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.018),0 12px 35px rgba(0,0,0,.12)
}
.lab{
  display:block;color:#a8b7c9;font-weight:800;font-size:14px;
  padding:16px 18px 0;margin:0;text-align:right
}
.amount{
  width:100%;border:0;outline:0;background:transparent;color:#fff;
  padding:7px 18px 18px;font-size:clamp(36px,5vw,54px);font-weight:900;
  text-align:left;direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:-1.4px
}
.currency{
  border-top:1px solid #25364a;background:rgba(7,14,23,.45);padding:0;
  border-radius:0 0 19px 19px;direction:ltr;position:relative
}
.pickerBtn{
  width:100%;min-height:58px;border:0;background:transparent;color:#eef4fa;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 15px;cursor:pointer;text-align:left
}
.pickerMain{min-width:0;display:flex;align-items:center;gap:10px}.pickerText{min-width:0;display:flex;flex-direction:column;justify-content:center}.pickerSub{display:none;margin-top:3px;color:#7894aa;font-size:10px;font-weight:500;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.currencyFlag{
  width:28px;min-width:28px;height:22px;display:flex;align-items:center;justify-content:center;
  font-size:21px;line-height:1;filter:saturate(.95)
}
.pickerCode{color:#59bdff;font-weight:950;font-size:17px;min-width:42px}
.pickerName{color:#edf3f9;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#7f92a8;font-size:12px}
.pickerPanel{
  display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:40;
  background:#0a121c;border:1px solid #30445d;border-radius:16px;
  box-shadow:0 24px 60px rgba(0,0,0,.52);padding:10px
}
.pickerPanel.open{display:block}
.search{
  width:100%;height:43px;border:1px solid #2b4058;border-radius:11px;outline:0;
  background:#07101a;color:#fff;padding:0 12px;font-size:14px;direction:ltr
}
.search:focus{border-color:#3176a7;box-shadow:0 0 0 3px rgba(54,149,215,.08)}
.search::placeholder{color:#65778b}
.options{margin-top:8px;max-height:245px;overflow:auto;border-top:1px solid #202e3e;padding-top:6px}
.option{
  width:100%;border:0;background:transparent;color:#e8eef5;display:grid;
  grid-template-columns:34px 55px minmax(0,1fr);gap:8px;align-items:center;
  padding:10px 9px;border-radius:10px;cursor:pointer;text-align:left;direction:ltr
}
.option:hover,.option:focus{background:#132033;outline:0}
.optionFlag{font-size:20px;line-height:1}
.optionCode{color:#62c3ff;font-weight:900}
.optionName{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:16px 8px;text-align:center;color:#75879b;font-size:13px}
.swap{
  width:60px;height:60px;border-radius:50%;border:1px solid #2777af;
  background:linear-gradient(180deg,#102c46,#0b2033);color:#6dc8ff;
  font-size:27px;font-weight:900;cursor:pointer;margin:22px auto 0;
  box-shadow:0 0 0 4px rgba(37,132,198,.055),0 10px 28px rgba(0,0,0,.22);
  transition:.18s ease
}
.swap:hover{transform:translateY(-1px);border-color:#42a8ed;color:#c9edff;box-shadow:0 0 0 4px rgba(56,159,226,.08),0 12px 32px rgba(0,0,0,.28)}
.ratebar{
  position:relative;margin-top:22px;background:rgba(6,13,22,.62);
  border:1px solid #23354a;border-radius:17px;padding:17px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:24px
}
.ratebar:after{
  content:"";position:absolute;left:50%;top:14px;bottom:14px;width:1px;background:#273a50
}
.rate{
  direction:ltr;flex:1;text-align:right;font-size:clamp(18px,2.4vw,25px);
  font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.3px
}
.rate span{color:#49b8fb}
.updated{
  flex:1;color:#91a2b6;font-size:13px;display:flex;align-items:center;gap:8px;
  direction:rtl;justify-content:flex-end
}
.updated:before{
  content:"◷";color:#b9d9ef;font-size:17px;line-height:1
}
.marketline{
  margin:13px auto 0;display:flex;justify-content:center;align-items:center;gap:8px;
  min-height:20px;color:#8fa1b4;font-size:12px;text-align:center;direction:ltr
}
.dot{width:8px;height:8px;border-radius:50%;background:#4fa3e3;box-shadow:0 0 0 3px rgba(79,163,227,.10)}
.marketline.street{color:#b9dbc6}
.marketline.street .dot{background:var(--green);box-shadow:0 0 0 3px rgba(57,218,124,.10),0 0 14px rgba(57,218,124,.28)}
.status{margin-top:8px;text-align:center;color:#7f91a5;font-size:12px}
.status:empty{display:none}
.status.error{color:#ef9b9b}
.foot{
  width:min(540px,78%);margin:24px auto 0;display:flex;align-items:center;gap:16px;
  color:#617289;font-weight:700;font-size:12px;letter-spacing:.3px
}
.foot:before,.foot:after{content:"";height:1px;background:#1f2d3d;flex:1}
html[dir="ltr"] .side{direction:ltr}
html[dir="ltr"] .lab{text-align:left}
html[dir="ltr"] .updated{direction:ltr;justify-content:flex-start}
@media(max-width:760px){
  body{background:linear-gradient(180deg,#07101a 0%,#05090f 100%)}
  .wrap{width:min(100% - 18px,560px);padding:10px 0 24px}
  .top{padding:8px 2px 14px}
  .home{padding:9px 12px;border-radius:13px;font-size:13px}
  .homeIcon{font-size:14px}
  .langSwitch{border-radius:13px}
  .langBtn{padding:7px 10px;font-size:12px}
  .card{margin-top:14px;padding:14px;border-radius:22px}
  .card:before{border-radius:22px}
  .grid{grid-template-columns:1fr;gap:11px}
  .box{border-radius:17px}
  .lab{padding:13px 14px 0;font-size:13px}
  .amount{padding:5px 14px 15px;font-size:clamp(34px,11vw,46px);letter-spacing:-1px}
  .currency{border-radius:0 0 16px 16px}
  .pickerBtn{min-height:54px;padding:11px 13px}
  .currencyFlag{width:25px;min-width:25px;font-size:19px}
  .pickerCode{font-size:16px}
  .pickerName{font-size:14px}
  .swap{width:54px;height:54px;font-size:25px;margin:1px auto;transform:rotate(90deg)}
  .swap:hover{transform:rotate(90deg)}
  .ratebar{margin-top:14px;padding:14px 15px;display:grid;grid-template-columns:1fr;gap:12px}
  .ratebar:after{display:none}
  .updated{order:1;justify-content:flex-start!important;direction:rtl;font-size:12px}
  .rate{order:2;text-align:center;font-size:20px}
  html[dir="ltr"] .updated{direction:ltr}
  .marketline{margin-top:11px;font-size:11.5px}
  .pickerPanel{position:absolute}
  .options{max-height:220px}
  .foot{margin-top:22px;width:82%;font-size:11px}
}
@media(min-width:1400px){
  .wrap{width:min(1180px,calc(100% - 48px))}
  .card{padding:34px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="home" id="homeLink" href="./"><span class="homeIcon">⌂</span><span>الرئيسية</span></a>
    <div class="langSwitch" aria-label="Language">
      <button class="langBtn active" id="langAr" type="button">عربي</button>
      <button class="langBtn" id="langEn" type="button">English</button>
    </div>
  </header>

  <section class="hero"><p id="subText"></p></section>

  <section class="card">
    <div class="grid">
      <div class="side">
        <div class="box">
          <label class="lab" id="fromLabel" for="fromAmount">من</label>
          <input class="amount" id="fromAmount" inputmode="decimal" autocomplete="off" value="100" aria-label="المبلغ من">
          <div class="currency" id="fromPicker">
            <button class="pickerBtn" id="fromPickerBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="pickerMain">
                <span class="currencyFlag" id="fromFlag">🇺🇸</span>
                <span class="pickerCode" id="fromCode">USD</span>
                <span class="pickerText"><span class="pickerName" id="fromName">US Dollar</span><span class="pickerSub" id="fromSub" dir="auto"></span></span>
              </span>
              <span class="chev">▼</span>
            </button>
            <div class="pickerPanel" id="fromPanel">
              <input class="search" id="fromSearch" autocomplete="off" placeholder="Search USD, Dollar, Peso...">
              <div class="options" id="fromOptions" role="listbox"></div>
            </div>
          </div>
        </div>
      </div>

      <button class="swap" id="swap" type="button" aria-label="عكس العملات">⇄</button>

      <div class="side">
        <div class="box">
          <label class="lab" id="toLabel" for="toAmount">إلى</label>
          <input class="amount" id="toAmount" inputmode="decimal" autocomplete="off" value="—" aria-label="المبلغ إلى">
          <div class="currency" id="toPicker">
            <button class="pickerBtn" id="toPickerBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="pickerMain">
                <span class="currencyFlag" id="toFlag">🇮🇶</span>
                <span class="pickerCode" id="toCode">IQD</span>
                <span class="pickerText"><span class="pickerName" id="toName">Iraqi Dinar</span><span class="pickerSub" id="toSub" dir="auto"></span></span>
              </span>
              <span class="chev">▼</span>
            </button>
            <div class="pickerPanel" id="toPanel">
              <input class="search" id="toSearch" autocomplete="off" placeholder="Search USD, Dollar, Peso...">
              <div class="options" id="toOptions" role="listbox"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="ratebar">
      <div class="updated" id="updatedText">آخر تحديث: —</div>
      <div class="rate" id="rateText">1 USD = <span>—</span> IQD</div>
    </div>
    <div class="marketline" id="marketLine"><span class="dot"></span><span id="marketText">—</span></div>
    <div class="status" id="status">جاري تحميل أسعار العملات…</div>
  </section>

  <footer class="foot">MazenmiX</footer>
</main>

<script>
const STREET_API='https://raw.githubusercontent.com/mazenmix/MX-Currency-/main/data/rates.json';
const IRAQ_MARKET_API='/api/market';
const FX_API='https://open.er-api.com/v6/latest/USD';
const STREET_KINDS=new Set(['parallel','street','informal','open-market','cash-market','free-market']);

const el={
  fromAmount:document.getElementById('fromAmount'),toAmount:document.getElementById('toAmount'),
  fromCode:document.getElementById('fromCode'),toCode:document.getElementById('toCode'),
  fromName:document.getElementById('fromName'),toName:document.getElementById('toName'),
  fromSub:document.getElementById('fromSub'),toSub:document.getElementById('toSub'),
  fromFlag:document.getElementById('fromFlag'),toFlag:document.getElementById('toFlag'),
  fromPickerBtn:document.getElementById('fromPickerBtn'),toPickerBtn:document.getElementById('toPickerBtn'),
  fromPanel:document.getElementById('fromPanel'),toPanel:document.getElementById('toPanel'),
  fromSearch:document.getElementById('fromSearch'),toSearch:document.getElementById('toSearch'),
  fromOptions:document.getElementById('fromOptions'),toOptions:document.getElementById('toOptions'),
  rateText:document.getElementById('rateText'),updatedText:document.getElementById('updatedText'),
  marketLine:document.getElementById('marketLine'),marketText:document.getElementById('marketText'),
  status:document.getElementById('status'),swap:document.getElementById('swap'),
  langAr:document.getElementById('langAr'),langEn:document.getElementById('langEn'),
  homeLink:document.getElementById('homeLink'),subText:document.getElementById('subText'),
  fromLabel:document.getElementById('fromLabel'),toLabel:document.getElementById('toLabel')
};

let rates={},meta={},bookUpdated=null,lastEdited='from',timer=null;
let lang=localStorage.getItem('mx_converter_lang')||'ar',fromCurrency='USD',toCurrency='IQD',codes=[];
const namesEn=new Intl.DisplayNames(['en'],{type:'currency'});
const namesAr=new Intl.DisplayNames(['ar'],{type:'currency'});
const T={
  ar:{home:'الرئيسية',sub:'',from:'من',to:'إلى',updated:'آخر تحديث',loading:'جاري تحديث أسعار السوق…',unavailable:'السعر غير متوفر حالياً',fetchError:'تعذر جلب آخر سعر حالياً',search:'ابحث USD أو Dollar أو Peso...',empty:'ماكو عملة مطابقة',street:'سوق شارع / موازي',market:'سوق عالمي',direction:'شراء/بيع فعلي',iraqBoard:'نفس السعر الأعلى من الصفحة الرئيسية',iqdSubtitle:'سعر صرف الكفاح/الحارثية'},
  en:{home:'Home',sub:'',from:'From',to:'To',updated:'Last updated',loading:'Updating market rates…',unavailable:'Rate is currently unavailable',fetchError:'Unable to fetch the latest rate',search:'Search USD, Dollar, Peso...',empty:'No matching currency',street:'Street / parallel market',market:'Global FX market',direction:'direction-aware cash',iraqBoard:'Same highest sell rate as the home page',iqdSubtitle:'Kifah / Harithiya exchange rate'}
};

function num(v){const n=Number(String(v).replace(/,/g,'').trim());return Number.isFinite(n)?n:0}
function fmt(n){if(!Number.isFinite(n))return '—';return new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(n)}
function fmtRate(n){if(!Number.isFinite(n))return '—';let max=6;if(n>=1000)max=2;else if(n>=100)max=3;else if(n>=1)max=4;return new Intl.NumberFormat('en-US',{maximumFractionDigits:max}).format(n)}
function formatLive(input){
  if(input.value==='—')return;
  const old=input.value,start=input.selectionStart??old.length,before=old.slice(0,start).replace(/,/g,'');
  let raw=old.replace(/,/g,'').replace(/[^0-9.]/g,'');
  const dot=raw.indexOf('.');if(dot!==-1)raw=raw.slice(0,dot+1)+raw.slice(dot+1).replace(/\./g,'');
  if(raw===''){input.value='';return}
  const hasDot=raw.includes('.');let [whole,dec='']=raw.split('.');whole=whole.replace(/^0+(?=\d)/,'')||'0';
  const grouped=whole.replace(/\B(?=(\d{3})+(?!\d))/g,',');const formatted=hasDot?`${grouped}.${dec}`:grouped;input.value=formatted;
  const significantBefore=before.replace(/[^0-9.]/g,'').length;let seen=0,newCaret=formatted.length;
  for(let i=0;i<formatted.length;i++){if(/[0-9.]/.test(formatted[i]))seen++;if(seen>=significantBefore){newCaret=i+1;break}}
  try{input.setSelectionRange(newCaret,newCaret)}catch{}
}
function currencyName(code,language=lang){try{return (language==='ar'?namesAr:namesEn).of(code)||code}catch{return code}}
function searchText(code){return `${code} ${currencyName(code,'en')} ${currencyName(code,'ar')}`.toLowerCase()}
function streetMeta(code){const m=meta[code];return m&&STREET_KINDS.has(String(m.kind||'').toLowerCase())?m:null}
function fromCurrencyToUsd(code){if(code==='USD')return 1;const r=Number(rates[code]);if(!(r>0))return NaN;const m=streetMeta(code),ask=Number(m?.sell);return 1/(ask>0?ask:r)}
function usdToCurrency(code){if(code==='USD')return 1;const r=Number(rates[code]);if(!(r>0))return NaN;const m=streetMeta(code),sell=Number(m?.sell);return sell>0?sell:r}
function crossRate(from,to){if(from===to)return 1;const a=fromCurrencyToUsd(from),b=usdToCurrency(to);return Number.isFinite(a)&&Number.isFinite(b)?a*b:NaN}
function pairStreetSources(){const arr=[];for(const code of [fromCurrency,toCurrency]){const m=streetMeta(code);if(m?.source&&!arr.includes(m.source))arr.push(m.source)}return arr}
function pairUpdatedDate(){const candidates=[];for(const code of [fromCurrency,toCurrency]){const raw=streetMeta(code)?.updatedAt;if(raw){const d=new Date(raw);if(!Number.isNaN(d.getTime()))candidates.push(d)}}if(candidates.length)return new Date(Math.max(...candidates.map(d=>d.getTime())));return bookUpdated||new Date()}
function currencyFlag(code){
  const flags={
    USD:'🇺🇸',IQD:'🇮🇶',EUR:'🇪🇺',GBP:'🇬🇧',PHP:'🇵🇭',TRY:'🇹🇷',AED:'🇦🇪',SAR:'🇸🇦',QAR:'🇶🇦',KWD:'🇰🇼',BHD:'🇧🇭',JOD:'🇯🇴',
    EGP:'🇪🇬',IRR:'🇮🇷',INR:'🇮🇳',PKR:'🇵🇰',CNY:'🇨🇳',JPY:'🇯🇵',KRW:'🇰🇷',THB:'🇹🇭',IDR:'🇮🇩',MYR:'🇲🇾',SGD:'🇸🇬',AUD:'🇦🇺',
    NZD:'🇳🇿',CAD:'🇨🇦',CHF:'🇨🇭',RUB:'🇷🇺',UAH:'🇺🇦',BRL:'🇧🇷',MXN:'🇲🇽',ARS:'🇦🇷',CLP:'🇨🇱',COP:'🇨🇴',PEN:'🇵🇪',
    ZAR:'🇿🇦',NGN:'🇳🇬',MAD:'🇲🇦',DZD:'🇩🇿',TND:'🇹🇳',LBP:'🇱🇧',SYP:'🇸🇾',OMR:'🇴🇲',YER:'🇾🇪',AFN:'🇦🇫',BDT:'🇧🇩',
    LKR:'🇱🇰',NPR:'🇳🇵',VND:'🇻🇳',KHR:'🇰🇭',LAK:'🇱🇦',MMK:'🇲🇲',HKD:'🇭🇰',TWD:'🇹🇼',SEK:'🇸🇪',NOK:'🇳🇴',DKK:'🇩🇰',
    PLN:'🇵🇱',CZK:'🇨🇿',HUF:'🇭🇺',RON:'🇷🇴',BGN:'🇧🇬',GEL:'🇬🇪',AMD:'🇦🇲',AZN:'🇦🇿',KZT:'🇰🇿'
  };
  return flags[code]||'💱'
}
function syncSelected(){
  el.fromCode.textContent=fromCurrency;el.toCode.textContent=toCurrency;
  el.fromName.textContent=currencyName(fromCurrency);el.toName.textContent=currencyName(toCurrency);
  el.fromFlag.textContent=currencyFlag(fromCurrency);el.toFlag.textContent=currencyFlag(toCurrency);
  for(const [sub,code] of [[el.fromSub,fromCurrency],[el.toSub,toCurrency]]){
    if(!sub)continue;
    const isIqd=code==='IQD';
    sub.textContent=isIqd?T[lang].iqdSubtitle:'';
    sub.style.display=isIqd?'block':'none';
  }
}
function closePickers(){for(const [panel,btn] of [[el.fromPanel,el.fromPickerBtn],[el.toPanel,el.toPickerBtn]]){panel.classList.remove('open');btn.setAttribute('aria-expanded','false')}}
function renderOptions(side,query=''){
  const box=side==='from'?el.fromOptions:el.toOptions,q=query.trim().toLowerCase(),filtered=codes.filter(code=>!q||searchText(code).includes(q));box.innerHTML='';
  if(!filtered.length){const d=document.createElement('div');d.className='empty';d.textContent=T[lang].empty;box.appendChild(d);return}
  filtered.forEach(code=>{const b=document.createElement('button');b.type='button';b.className='option';b.setAttribute('role','option');b.innerHTML=`<span class="optionFlag">${currencyFlag(code)}</span><span class="optionCode">${code}</span><span class="optionName"></span>`;b.querySelector('.optionName').textContent=currencyName(code);b.addEventListener('click',()=>{if(side==='from')fromCurrency=code;else toCurrency=code;syncSelected();closePickers();render(lastEdited)});box.appendChild(b)})
}
function openPicker(side){const panel=side==='from'?el.fromPanel:el.toPanel,btn=side==='from'?el.fromPickerBtn:el.toPickerBtn,search=side==='from'?el.fromSearch:el.toSearch;const wasOpen=panel.classList.contains('open');closePickers();if(wasOpen)return;panel.classList.add('open');btn.setAttribute('aria-expanded','true');search.value='';renderOptions(side,'');setTimeout(()=>search.focus(),0)}
function setLanguage(next){lang=next;localStorage.setItem('mx_converter_lang',lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';el.langAr.classList.toggle('active',lang==='ar');el.langEn.classList.toggle('active',lang==='en');el.homeLink.querySelector('span:last-child').textContent=T[lang].home;el.subText.textContent=T[lang].sub;el.fromLabel.textContent=T[lang].from;el.toLabel.textContent=T[lang].to;el.fromSearch.placeholder=T[lang].search;el.toSearch.placeholder=T[lang].search;el.swap.setAttribute('aria-label',lang==='ar'?'عكس العملات':'Swap currencies');document.title=(lang==='ar'?'محول العملة السريع':'Quick Currency Converter')+' | MX Exchanger';syncSelected();renderOptions('from',el.fromSearch.value);renderOptions('to',el.toSearch.value);render(lastEdited)}
function setUpdated(){const d=pairUpdatedDate();el.updatedText.textContent=T[lang].updated+': '+new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
function renderMarketLine(){const sources=pairStreetSources(),isStreet=sources.length>0;if([fromCurrency,toCurrency].includes('IQD')&&streetMeta('IQD')){el.marketLine.style.display='flex';el.marketLine.classList.add('street');el.marketText.textContent=T[lang].iraqBoard;return}if(isStreet){el.marketLine.style.display='flex';el.marketLine.classList.add('street');const directionAware=[fromCurrency,toCurrency].some(c=>{const m=streetMeta(c);return Number(m?.buy)>0&&Number(m?.sell)>0});el.marketText.textContent=`${T[lang].street} · ${sources.join(' + ')}${directionAware?' · '+T[lang].direction:''}`;return}el.marketLine.style.display='none';el.marketLine.classList.remove('street');el.marketText.textContent=''}
async function applyIraqMarket(){
  try{
    const r=await fetch(IRAQ_MARKET_API+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('Iraq market HTTP '+r.status);
    const d=await r.json();

    // Keep USD/IQD identical to the homepage "highest price" card:
    // highest SELL among Kifah, Harithiya and Kukh Alomlat.
    const boards=[
      ['Kifah',d.kifah],
      ['Harithiya',d.harithiya],
      ['Kukh Alomlat',d.kukh]
    ].filter(([,q])=>q&&Number(q.sell)>0);
    if(!boards.length)throw new Error('No Baghdad market quote');

    const [boardName,board]=boards.reduce((best,cur)=>Number(cur[1].sell)>Number(best[1].sell)?cur:best);
    const sell100=Number(board.sell);
    const buy100=Number(board.buy);
    const sell=sell100/100;
    const buy=(buy100>0?buy100:sell100)/100;

    rates.IQD=sell;
    meta.IQD={
      kind:'parallel',
      source:'MX Exchanger highest sell · '+boardName,
      buy,
      sell,
      updatedAt:d.usd_meta?.published_at||d.updated_at||new Date().toISOString()
    };
  }catch(_){}
}
function render(direction='from'){
  const r=crossRate(fromCurrency,toCurrency);syncSelected();renderMarketLine();setUpdated();
  if(!Number.isFinite(r)){el.status.className='status error';el.status.textContent=T[lang].unavailable;return}
  if(direction==='from'){el.toAmount.value=fmt(num(el.fromAmount.value)*r);el.rateText.innerHTML=`1 ${fromCurrency} = <span>${fmtRate(r)}</span> ${toCurrency}`}
  else{const inv=crossRate(toCurrency,fromCurrency);if(!Number.isFinite(inv)){el.status.className='status error';el.status.textContent=T[lang].unavailable;return}el.fromAmount.value=fmt(num(el.toAmount.value)*inv);el.rateText.innerHTML=`1 ${toCurrency} = <span>${fmtRate(inv)}</span> ${fromCurrency}`}
  el.status.className='status';el.status.textContent=''
}
async function load(){
  el.status.className='status';el.status.textContent=T[lang].loading;let loaded=false;
  try{const r=await fetch(STREET_API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Street HTTP '+r.status);const d=await r.json();if(d.base!=='USD'||!d.rates)throw new Error('bad street data');rates=d.rates;meta=d.meta||{};const t=new Date(d.updatedAt||Date.now());bookUpdated=Number.isNaN(t.getTime())?new Date():t;loaded=true}catch(_){}
  if(!loaded){try{const r=await fetch(FX_API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('FX HTTP '+r.status);const d=await r.json();if(d.result!=='success'||!d.rates)throw new Error('bad fx data');rates=d.rates;meta={};bookUpdated=d.time_last_update_unix?new Date(d.time_last_update_unix*1000):new Date();loaded=true}catch(_){}}
  if(!loaded){el.status.className='status error';el.status.textContent=T[lang].fetchError;return}
  await applyIraqMarket();
  codes=Object.keys(rates).filter(c=>/^[A-Z]{3}$/.test(c)).sort();renderOptions('from');renderOptions('to');render(lastEdited)
}
function schedule(side){lastEdited=side;clearTimeout(timer);timer=setTimeout(()=>render(side),120)}
el.fromAmount.addEventListener('input',()=>{formatLive(el.fromAmount);schedule('from')});el.toAmount.addEventListener('input',()=>{formatLive(el.toAmount);schedule('to')});el.fromAmount.addEventListener('focus',()=>lastEdited='from');el.toAmount.addEventListener('focus',()=>lastEdited='to');
el.fromPickerBtn.addEventListener('click',()=>openPicker('from'));el.toPickerBtn.addEventListener('click',()=>openPicker('to'));el.fromSearch.addEventListener('input',e=>renderOptions('from',e.target.value));el.toSearch.addEventListener('input',e=>renderOptions('to',e.target.value));
el.swap.addEventListener('click',()=>{const fc=fromCurrency,tc=toCurrency,fv=el.fromAmount.value,tv=el.toAmount.value;fromCurrency=tc;toCurrency=fc;el.fromAmount.value=tv==='—'?'100':tv;el.toAmount.value=fv;lastEdited='from';render('from')});
el.langAr.addEventListener('click',()=>setLanguage('ar'));el.langEn.addEventListener('click',()=>setLanguage('en'));
document.addEventListener('click',e=>{if(!document.getElementById('fromPicker').contains(e.target)&&!document.getElementById('toPicker').contains(e.target))closePickers()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePickers()});
setLanguage(lang);load();setInterval(load,60000);
</script>
</body>
