name: Build MX TV Optimized APK

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/build-mx-tv-optimized.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mx-tv-optimized-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout MX TV builder
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Checkout pinned StreamVault source
        shell: bash
        run: |
          set -euo pipefail
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3 4; do
            rm -rf StreamVault-src
            git init StreamVault-src
            git -C StreamVault-src remote add origin https://github.com/Davidona/StreamVault-IPTV.git
            if git -C StreamVault-src fetch --depth=1 origin 593333714c43cb1802e14a1452cd9f5906e0a286; then
              git -C StreamVault-src checkout --detach FETCH_HEAD
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "Unable to fetch pinned source after 4 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Apply MX TV optimization patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_mxtv.py StreamVault-src

      - name: Build signed debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd StreamVault-src
          chmod +x gradlew
          ./gradlew --console=plain :app:assembleDebug

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find StreamVault-src/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" MX-TV-FastSync-RoomyTV.apk
          sha256sum MX-TV-FastSync-RoomyTV.apk > MX-TV-FastSync-RoomyTV.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MX-TV-FastSync-RoomyTV
          path: |
            MX-TV-FastSync-RoomyTV.apk
            MX-TV-FastSync-RoomyTV.apk.sha256
          if-no-files-found: error
