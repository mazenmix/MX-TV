name: MX Dollar backup market update

on:
  schedule:
    - cron: "9,24,39,54 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest market data
        run: |
          python web/update_market.py
          cp web/data.json /tmp/mx-dollar-data.json
      - name: Publish market data
        run: |
          git config user.name "MX Dollar Backup Bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mx-dollar-data.json web/data.json
            git add web/data.json
            git diff --cached --quiet && exit 0
            git commit -m "[CF-Pages-Skip] Backup update MX Dollar market data"
            git push origin main && exit 0
            sleep 2
          done
          exit 1
