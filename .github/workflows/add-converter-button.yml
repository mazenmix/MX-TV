name: Add converter button safely

on:
  push:
    paths:
      - '.github/workflows/add-converter-button.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve beta link and add converter button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/index.html')
          s=p.read_text(encoding='utf-8')
          old='<a class="betaLink abs" href="./converter.html">محول العملة السريع</a>'
          new='<a class="betaLink abs" href="./beta.html">النسخة الموسعة هنا</a>\n  <a class="betaLink converterButton abs" href="./converter.html">محول العملة السريع</a>'
          if old not in s:
              raise SystemExit('Converter anchor target not found; no change made.')
          s=s.replace(old,new,1)
          marker='</style>'
          css='\n/* MX quick converter entry */\n.converterButton{right:300px!important;width:160px!important;border-color:#2f6f9d!important;background:#102032!important;color:#77caff!important;box-shadow:none!important}\n.converterButton:hover{filter:brightness(1.08)}\n'
          if '.converterButton{' not in s:
              s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add quick currency converter button'
          git push
