name: MX Dollar main layout comfort hotfix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mxdollar-main-layout-comfort-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand cards and spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/index.html')
          s=p.read_text(encoding='utf-8')
          marker="""
          /* MX main layout comfort upgrade */
          #viewport{height:812px!important}
          #app{height:812px!important}
          .header{height:82px!important}
          .brand{top:20px!important}
          .betaLink{top:27px!important;height:30px!important;width:142px!important;border-radius:15px!important}
          .live{top:27px!important;height:30px!important;border-radius:15px!important}
          .hero{left:24px!important;top:104px!important;width:712px!important;height:206px!important;border-radius:26px!important}
          .accent{height:206px!important;width:11px!important}
          .usdlabel{left:30px!important;top:23px!important;width:210px!important}
          .heroar{left:30px!important;top:55px!important;width:330px!important}
          .mainprice{left:30px!important;top:86px!important;width:385px!important}
          .iqd{left:405px!important;top:101px!important;width:65px!important}
          .chip{left:480px!important;width:205px!important;height:60px!important;border-radius:17px!important;padding:0 7px!important}
          .buy{top:29px!important}.sell{top:105px!important}
          .chiplabel{width:88px!important}.chipval{width:102px!important}
          .source{top:334px!important;width:224px!important;height:118px!important;border-radius:20px!important}
          .s1{left:24px!important}.s2{left:268px!important}.s3{left:512px!important}
          .code{left:16px!important;top:14px!important;width:86px!important;height:24px!important;line-height:24px!important}
          .arname{left:96px!important;top:12px!important;right:14px!important;height:27px!important;line-height:27px!important}
          .selllab{left:16px!important;top:61px!important;width:34px!important}
          .sellvalue{left:53px!important;top:59px!important;width:72px!important}
          .buylab{left:125px!important;top:61px!important;width:39px!important}
          .buyvalue{left:165px!important;top:59px!important;right:12px!important}
          .goldtitle{left:24px!important;top:479px!important;width:330px!important;height:34px!important;line-height:34px!important}
          .goldsub{left:406px!important;top:479px!important;width:330px!important;height:34px!important;line-height:34px!important}
          .goldcard{top:525px!important;width:224px!important;height:138px!important;border-radius:20px!important}
          .g18{left:24px!important}.g21{left:268px!important}.g24{left:512px!important}
          .kbadge{left:16px!important;top:16px!important;width:58px!important;height:30px!important;border-radius:15px!important}
          .kar{left:84px!important;top:16px!important;right:16px!important;height:30px!important}
          .gprice{left:14px!important;top:59px!important;right:14px!important;height:42px!important}
          .giqd{left:16px!important;top:108px!important;right:16px!important;height:20px!important}
          .footer{left:24px!important;top:690px!important;width:712px!important;height:88px!important;border-radius:22px!important}
          .updated{left:14px!important;top:12px!important;width:500px!important;height:30px!important}
          .sig{left:14px!important;top:47px!important;width:500px!important;height:26px!important}
          .refresh{left:526px!important;top:18px!important;width:170px!important;height:52px!important;border-radius:16px!important}
          .err{left:24px!important;top:786px!important;width:712px!important;height:20px!important;line-height:20px!important}
          """
          if 'MX main layout comfort upgrade' not in s:
              s=s.replace('</style>', marker+'\n</style>', 1)
          s=s.replace('const DESIGN_W=760,DESIGN_H=708;', 'const DESIGN_W=760,DESIGN_H=812;')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'MX main layout comfort upgrade' web/index.html
          grep -q 'DESIGN_H=812' web/index.html
      - name: Commit and push
        run: |
          git config user.name "Mazen"
          git config user.email "mazenmix@gmail.com"
          git add web/index.html
          git commit -m "Make MX Dollar main cards roomier and cleaner"
          git push origin main
