name: MX Dollar gold back button hotfix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mxdollar-back-gold-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update beta back button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/beta.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('href="./index.html">الرجوع للنسخة المصغرة</a>', 'href="https://mxdollar.pages.dev/">الرجوع للنسخة المصغرة</a>', 1)

          old='.backLink{border-color:rgba(72,162,255,.62);color:#bfe1ff;background:rgba(72,162,255,.08);direction:rtl;white-space:nowrap}.backLink:hover{border-color:#70b9ff;background:rgba(72,162,255,.14)}'
          new='.backLink{border:1px solid rgba(255,202,66,.9);color:#ffe8a6;background:linear-gradient(180deg,rgba(255,202,66,.16),rgba(112,78,0,.16));direction:rtl;white-space:nowrap;box-shadow:0 0 18px rgba(255,202,66,.12),inset 0 1px 0 rgba(255,255,255,.06);transition:.18s ease}.backLink:hover{border-color:#ffd86b;color:#fff0bd;background:linear-gradient(180deg,rgba(255,202,66,.23),rgba(112,78,0,.22));box-shadow:0 0 22px rgba(255,202,66,.18),inset 0 1px 0 rgba(255,255,255,.08);transform:translateY(-1px)}'
          if old not in s:
              raise SystemExit('Expected backLink CSS not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify requested changes
        shell: bash
        run: |
          grep -q 'href="https://mxdollar.pages.dev/">الرجوع للنسخة المصغرة</a>' web/beta.html
          grep -q 'border:1px solid rgba(255,202,66,.9)' web/beta.html

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/beta.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Style beta back button in gold"
            git push origin HEAD:main
          fi
