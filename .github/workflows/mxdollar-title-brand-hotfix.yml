name: MX Dollar title and header hotfix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mxdollar-title-brand-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch MX Dollar pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Main page
          p = Path('web/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>MX Dollar</title>', '<title>أسعار الصرف اليوم</title>', 1)
          s = s.replace('<div class="brandbox abs">$</div>\n  <div class="brand abs">MX DOLLAR</div>', '<div class="brand abs">أسعار الصرف اليوم</div>', 1)
          old_brand_css = '.brand{left:82px;top:17px;width:218px;height:27px;direction:ltr;text-align:left;font-weight:700;font-size:24px;line-height:27px;color:#f5f7fa}'
          new_brand_css = '.brand{left:28px;top:17px;width:272px;height:40px;direction:rtl;text-align:left;font-weight:800;font-size:22px;line-height:40px;color:#f5f7fa;white-space:nowrap}'
          s = s.replace(old_brand_css, new_brand_css, 1)
          p.write_text(s, encoding='utf-8')

          # Beta page
          p = Path('web/beta.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>MX Dollar Beta</title>', '<title>أسعار الصرف اليوم</title>', 1)
          s = s.replace('<div class="brand"><b>MX</b> Dollar Beta</div>', '<div class="brand" aria-hidden="true"></div>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify requested text changes
        shell: bash
        run: |
          grep -q '<title>أسعار الصرف اليوم</title>' web/index.html
          grep -q '<title>أسعار الصرف اليوم</title>' web/beta.html
          grep -q '<div class="brand abs">أسعار الصرف اليوم</div>' web/index.html
          ! grep -q 'MX DOLLAR' web/index.html
          ! grep -q 'MX Dollar Beta' web/beta.html

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/index.html web/beta.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Update MX Dollar titles and headers"
            git push origin HEAD:main
          fi
