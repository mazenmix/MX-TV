name: Link quick currency converter

on:
  push:
    paths:
      - '.github/workflows/link-currency-converter.yml'

permissions:
  contents: write

jobs:
  patch-home-link:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point home button to converter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="betaLink abs" href="./beta.html">النسخة الموسعة هنا</a>'
          new = '<a class="betaLink abs" href="./converter.html">محول العملة السريع</a>'
          if old not in s:
              raise SystemExit('Target home link not found; index left unchanged.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Link quick currency converter from home'
          git push
