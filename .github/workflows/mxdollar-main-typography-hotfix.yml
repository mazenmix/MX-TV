name: MX Dollar main typography hotfix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mxdollar-main-typography-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enlarge and refine main-page typography
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* MX main typography upgrade */'
          if marker not in s:
              css='''\n\n/* MX main typography upgrade */\n.brand{font-size:27px!important;font-weight:850!important;letter-spacing:-.35px!important}\n.betaLink{font-size:12.5px!important;font-weight:850!important;letter-spacing:.05px!important}\n.live{font-size:13.5px!important;font-weight:850!important}\n.usdlabel{font-size:18px!important;font-weight:800!important;letter-spacing:.15px!important}\n.heroar{font-size:19px!important;font-weight:700!important;color:#c2ccd7!important}\n.mainprice{font-size:52px!important;line-height:63px!important;font-weight:800!important;letter-spacing:-1.35px!important}\n.iqd{font-size:18px!important;font-weight:800!important;color:#9ca8b7!important}\n.chiplabel{font-size:15px!important;font-weight:750!important}\n.chipval{font-size:20px!important;font-weight:850!important;letter-spacing:-.25px!important}\n.code{font-size:13px!important;font-weight:850!important;letter-spacing:.15px!important}\n.arname{font-size:13.5px!important;font-weight:750!important;color:#d0d8e1!important}\n.selllab,.buylab{font-size:11.5px!important;font-weight:750!important}\n.sellvalue,.buyvalue{font-size:15.5px!important;font-weight:850!important}\n.goldtitle{font-size:21px!important;font-weight:850!important;letter-spacing:.15px!important}\n.goldsub{font-size:15px!important;font-weight:700!important;color:#9aa5b2!important}\n.kbadge{font-size:13px!important;font-weight:850!important}\n.kar{font-size:14px!important;font-weight:750!important;color:#b5bec9!important}\n.gprice{font-size:29px!important;font-weight:850!important;letter-spacing:-.35px!important}\n.giqd{font-size:12.5px!important;font-weight:700!important;color:#948761!important}\n.updated{font-size:13.5px!important;font-weight:700!important;color:#909cab!important}\n.sig{font-size:15px!important;font-weight:850!important}\n.refresh{font-size:14.5px!important;font-weight:850!important}\n.err{font-size:11px!important}\n.hero,.source,.goldcard,.footer{box-shadow:0 12px 34px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.025)}\n'''
              s=s.replace('</style>',css+'\n</style>',1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          grep -q 'MX main typography upgrade' web/index.html
          grep -q 'font-size:52px' web/index.html
          grep -q 'font-size:29px' web/index.html

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Improve MX Dollar main page typography"
            git push origin HEAD:main
          fi
