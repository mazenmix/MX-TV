name: Update MX Dollar market data

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "web/update_market.py"
      - ".github/workflows/update-mx-dollar-data.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest market data
        run: |
          python web/update_market.py
          cp web/data.json /tmp/mx-dollar-data.json
      - name: Commit market data
        run: |
          git config user.name "MX Dollar Bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mx-dollar-data.json web/data.json
            git add web/data.json
            git diff --cached --quiet && exit 0
            git commit -m "[CF-Pages-Skip] Update MX Dollar market data"
            git push origin main && exit 0
            echo "Push race detected; retrying..."
            sleep 2
          done
          exit 1
